<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'"
    >
    <meta name="description" content="Live and historical sauna temperatures.">
    <title>Sauna Time</title>
    <script src="/color-scheme.js"></script>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="shell">
      <div id="error-banner" class="error-banner" role="alert" hidden></div>

      <section class="instrument-ledger" aria-label="Current conditions">
        <div class="temperature-ledger">
          <div class="instrument-row">
            <p class="instrument-label">Air</p>
            <p class="metric-value"><span id="sauna-temp">—</span><span class="metric-unit">°F</span></p>
          </div>
          <div class="instrument-row">
            <label class="instrument-label" for="target-temp">Air target</label>
            <span class="metric-value target-value">
              <input id="target-temp" type="number" min="100" max="220" step="5" value="180" inputmode="decimal" autocomplete="off">
              <span class="metric-unit">°F</span>
            </span>
          </div>
          <div class="instrument-row">
            <p class="instrument-label">Stovepipe</p>
            <p class="metric-value"><span id="pipe-temp">—</span><span class="metric-unit">°F</span></p>
          </div>
        </div>

        <div class="status-ledger" aria-live="polite">
          <div class="status-row">
            <p id="heat-state-label" class="status-label">Status</p>
            <p id="heat-state" class="status-value">—</p>
          </div>
          <div id="heat-detail-row" class="status-row">
            <p id="heat-detail-label" class="status-label">Estimate</p>
            <p id="heat-detail" class="status-value">Unavailable</p>
          </div>
        </div>
      </section>

      <section class="history" aria-label="Temperature history">
        <div id="range-controls" class="range-controls" role="group" aria-label="History range">
            <button type="button" data-range="1h" aria-pressed="false">1 hour</button>
            <button type="button" data-range="3h" aria-pressed="true">3 hours</button>
            <button type="button" data-range="12h" aria-pressed="false">12 hours</button>
            <button type="button" data-range="24h" aria-pressed="false">24 hours</button>
            <button type="button" data-range="7d" aria-pressed="false">7 days</button>
            <button type="button" data-range="30d" aria-pressed="false">1 month</button>
            <button type="button" data-range="all" aria-pressed="false">All time</button>
        </div>
        <div id="history-charts" class="charts" aria-label="Linked temperature and change charts"></div>
      </section>

      <div id="color-scheme-controls" class="color-scheme-controls" role="group" aria-label="Color scheme">
        <button type="button" data-color-scheme="system" aria-pressed="true">System</button>
        <button type="button" data-color-scheme="light" aria-pressed="false">Light</button>
        <button type="button" data-color-scheme="dark" aria-pressed="false">Dark</button>
      </div>
    </main>
    <noscript>This dashboard requires JavaScript to render its charts.</noscript>
  </body>
</html>
